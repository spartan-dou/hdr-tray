# Pousser un tag vX.Y.Z (identique à la version de Cargo.toml) compile et publie la release.
# Les appli installées la détectent ensuite via version.txt.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que le tag correspond à Cargo.toml
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME ≠ version v$VERSION"; exit 1; }

      - name: Compiler (Docker)
        run: |
          docker build -t hdrtray-build .
          docker run --rm -v "$PWD":/src hdrtray-build

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/HDRTray-Setup.exe dist/HDRTray-Setup-arm64.exe \
            dist/HDRTray.exe dist/HDRTray-arm64.exe dist/version.txt \
            --title "HDR Tray $GITHUB_REF_NAME" --generate-notes
