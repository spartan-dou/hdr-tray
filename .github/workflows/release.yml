# Pousser un tag vX.Y.Z (identique à la version de Cargo.toml) compile et publie la release.
# Les appli installées la détectent ensuite via version.txt et vérifient l'installeur avec SHA256SUMS.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que le tag correspond à Cargo.toml
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME ≠ version v$VERSION"; exit 1; }

      - name: Compiler (Docker)
        run: |
          docker build -t hdrtray-build .
          docker run --rm -v "$PWD":/src hdrtray-build

      - name: Versions portables (zip) et empreintes
        run: |
          sudo chown -R "$USER" dist # créé par root dans le conteneur
          for pair in "HDRTray.exe:x64" "HDRTray-arm64.exe:arm64"; do
            exe=${pair%%:*}; arch=${pair##*:}
            tmp=$(mktemp -d)
            cp "dist/$exe" "$tmp/HDRTray.exe"
            cp LICENSE "$tmp/"
            (cd "$tmp" && zip -q "$OLDPWD/dist/HDRTray-portable-$arch.zip" HDRTray.exe LICENSE)
          done
          # SHA256SUMS est consulté par l'appli pour vérifier l'installeur : il couvre tous les fichiers
          (cd dist && sha256sum HDRTray-Setup.exe HDRTray-Setup-arm64.exe HDRTray.exe HDRTray-arm64.exe \
            HDRTray-portable-x64.zip HDRTray-portable-arm64.zip > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # WiX ne fonctionne que sous Windows
  msi:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Paquets MSI (x64 et ARM64)
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          dotnet tool install --global wix --version 5.0.2
          New-Item -ItemType Directory -Force msi | Out-Null
          foreach ($p in @(@('x64', 'HDRTray.exe'), @('arm64', 'HDRTray-arm64.exe'))) {
            wix build packaging/hdrtray.wxs -arch $p[0] -d Version=$version -d Exe=dist/$($p[1]) -d Icon=dist/hdr.ico -o msi/HDRTray-$($p[0]).msi
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: msi
          path: msi/
          if-no-files-found: error

  publish:
    needs: [build, msi]
    runs-on: ubuntu-latest
    permissions:
      contents: write # seul ce job peut créer la release
      id-token: write # attestation de provenance
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: msi
          path: dist

      - name: Empreintes des MSI
        run: cd dist && sha256sum *.msi >> SHA256SUMS && cat SHA256SUMS

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip
            dist/*.msi

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            dist/HDRTray-Setup.exe dist/HDRTray-Setup-arm64.exe \
            dist/HDRTray.exe dist/HDRTray-arm64.exe dist/HDRTray-portable-x64.zip dist/HDRTray-portable-arm64.zip \
            dist/HDRTray-x64.msi dist/HDRTray-arm64.msi \
            dist/version.txt dist/SHA256SUMS \
            --title "HDR Tray $GITHUB_REF_NAME" --generate-notes
